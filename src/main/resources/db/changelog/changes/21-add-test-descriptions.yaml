        - insert:
            tableName: descriptions
            columns:
              - column: {name: title, value: "Відкритий мікрофон"}
              - column: {name: description, value: "🎤 Спробуйте себе у стендапі, поезії чи музиці! Відкритий мікрофон – ідеальна нагода проявити себе перед публікою."}
        - insert:
            tableName: descriptions
            columns:
              - column: {name: title, value: "Курс виживання в дикій природі"}
              - column: {name: description, value: "🏕️ Дізнайтеся, як орієнтуватися на місцевості, розпалювати вогонь та виживати в природі без сучасних зручностей."}
        - insert:
            tableName: descriptions
            columns:
              - column: {name: title, value: "Літературний вечір"}
              - column: {name: description, value: "📖 Проведіть вечір у компанії улюблених авторів, обговоріть книги та поділіться враженнями."}
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Йога на даху" }
              - column: {
                name: description,
                value: "🧘 Ранкова йога з панорамою на місто!\n\nПочніть день із розтяжки, дихальних вправ і медитації під відкритим небом.\n\n🌄 Програма:\n- 60 хвилин практики з інструктором\n- Чайна церемонія після заняття\n- Музика та легка атмосфера\n\nНе забудьте килимок і пляшку води."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Курс цифрового малювання" }
              - column: {
                name: description,
                value: "🖌️ Освой цифрову ілюстрацію з нуля.\n\nП’ятиденний інтенсив із малювання на планшетах під керівництвом досвідченого ілюстратора.\n\n🧠 Ви навчитесь:\n- Працювати в Procreate та Photoshop\n- Створювати персонажів і фони\n- Побудові власного арт-портфоліо\n\nПланшети видаються на місці."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Ніч настільних ігор" }
              - column: {
                name: description,
                value: "🎲 Зустрічайте ніч без сну у світі настільних розваг!\n\nБільше 100 ігор: класика, новинки, стратегія, вечірки.\n\n👥 Організація:\n- Наставники для новачків\n- Турніри з призами\n- Кава, снеки, лаунж-зона\n\nВхідний квиток покриває доступ до всіх ігор."
              }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Велопрогулянка містом" }
              - column: {
                name: description,
                value: "🚴‍♂️ Приєднуйтесь до дружньої велоспільноти!\n\nЩотижнева велопрогулянка центральними вулицями та парками. Темп – помірний, маршрут – мальовничий.\n\n🗺️ Старт: Площа Свободи, 10:00\n\nПриїжджайте з власним велосипедом або орендуйте на місці."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Благодійний книжковий ярмарок" }
              - column: {
                name: description,
                value: "📚 Купуй, читай, допомагай!\n\nВеликий збір літератури від волонтерів, письменників та видавництв. Кошти підуть на підтримку бібліотек у селах.\n\n📦 Очікуйте:\n- Художня, наукова, дитяча література\n- Авторські читання\n- Зона буккросингу\n\nПринеси й свої книжки – вони знайдуть нових читачів!"
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Скетчінг в парку" }
              - column: {
                name: description,
                value: "✏️ Візьми олівець і піди на природу!\n\nВоркшоп із міського скетчінгу – ідеальний спосіб розвинути спостережливість і креатив.\n\n📒 Що буде:\n- Невеликі теоретичні блоки\n- Малювання на відкритому повітрі\n- Групова критика та підтримка\n\nПідходить для будь-якого рівня підготовки."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Кіберспортивний турнір" }
              - column: {
                name: description,
                value: "🕹️ Час показати свої навички в грі!\n\nТурнір із популярної гри CS2 серед місцевих геймерів. Гарантований призовий фонд.\n\n🔫 Організація:\n- Система Double Elimination\n- Професійні судді\n- Трансляція фіналів з коментуванням\n\nРеєстрація відкрита до 10 червня."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Школа стендап-комедії" }
              - column: {
                name: description,
                value: "🎤 Розсміши зал — це мистецтво.\n\nІнтенсив з написання та подачі стендап-матеріалу. Кожен учасник вийде на сцену!\n\n🤹 У програмі:\n- Побудова жарту\n- Робота з залом\n- Вечір відкритого мікрофона\n\nДля всіх, хто хоче спробувати себе у гуморі."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Тренінг з емоційного інтелекту" }
              - column: {
                name: description,
                value: "🧠 Керуйте емоціями — керуйте життям.\n\nПсихологічний тренінг про розпізнавання емоцій, управління станами та емпатію.\n\n📊 У програмі:\n- Техніки самоспостереження\n- Вправи в парах\n- Практика активного слухання\n\nУчасники отримують сертифікат проходження."
              }
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Майстерня кавової культури" }
              - column: {
                name: description,
                value: "☕ Розкрий секрети ідеальної кави.\n\nНавчання від професійного бариста — від зерна до чашки.\n\n🍂 Програма:\n- Методи заварювання: фільтр, кемекс, аеропрес\n- Основи латте-арту\n- Дегустація сортів\n\nКожен учасник отримає набір кави з собою."
              }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Арт-терапія для дорослих" }
              - column: {
                name: description,
                value: "🎨 Відчуйте емоційне розвантаження через мистецтво!\n\nНаш майстер-клас з арт-терапії допоможе вам розслабитися, висловити свої емоції та знайти нове джерело натхнення.\n\n📌 У програмі:\n\n- Техніки вільного малювання\n- Робота з кольорами та емоціями\n- Індивідуальні поради від професійного арт-терапевта\n\nЖодних художніх навичок не потрібно – тільки бажання відчути себе вільним." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Кіноніч просто неба" }
              - column: {
                name: description,
                value: "🌌 Влаштуйте собі незабутню ніч кіно під зорями!\n\nУ затишному парку на великому екрані транслюватимуться класичні фільми та новинки кінематографу.\n\n🍿 У програмі:\n\n- Зони з пуфами та ковдрами\n- Вулична їжа та напої\n- Розіграш призів між переглядами\n\nПриходьте з друзями або на побачення – атмосфера буде чарівною." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Воркшоп з фотографії" }
              - column: {
                name: description,
                value: "📸 Навчіться знімати як професіонал!\n\nПоглиблений воркшоп для початківців і тих, хто хоче вийти за рамки «авто» режиму.\n\n🎓 Ви дізнаєтесь:\n\n- Як працює композиція\n- Основи роботи з світлом\n- Постобробка фото у Lightroom\n\nПісля заходу – спільна фотопрогулянка містом." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Фестиваль вуличної музики" }
              - column: {
                name: description,
                value: "🎶 Гучний вуличний фестиваль повертається!\n\nБільше 30 музикантів на 5 сценах у центрі міста. Різні жанри: від фолку до електроніки.\n\n🌟 У програмі:\n\n- Лайв-сети просто неба\n- Танцювальні майданчики\n- Інтерактивні зони для дітей\n\nВхід вільний, атмосфера драйвова!" }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Кулінарна битва аматорів" }
              - column: {
                name: description,
                value: "🍲 Готуй як шеф – змагайся як аматор!\n\nПрийміть участь у кулінарному поєдинку та покажіть, що ваше рагу – найкраще.\n\n🔥 Що входить:\n\n- Командне приготування страв\n- Оцінювання від шеф-кухарів\n- Призи для переможців\n\nЗапрошуються учасники з базовими навичками." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Мовний клуб англійської" }
              - column: {
                name: description,
                value: "🗣️ Покращуйте свою англійську в дружній атмосфері.\n\nЩотижневі зустрічі з носіями мови для розмовної практики.\n\n📖 На вас чекає:\n\n- Тематичні обговорення\n- Настільні ігри англійською\n- Поради з вимови та граматики\n\nПідійде для рівнів A2–B2." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Курс самооборони для жінок" }
              - column: {
                name: description,
                value: "🥋 Почувайся впевнено у будь-якій ситуації.\n\nТренування з інструкторами, які покажуть ефективні методи захисту у стресових ситуаціях.\n\n👊 У програмі:\n\n- Основи технік блокування\n- Робота з дистанцією\n- Практика в парах\n\nОбов’язково зручний одяг і гарний настрій!" }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Екологічний пікнік" }
              - column: {
                name: description,
                value: "🌿 Проведіть день на природі з користю для планети!\n\nЗбираємось на зеленій галявині для екоактивностей, лекцій та нетворкінгу.\n\n🧺 Програма:\n\n- Обмін речами (Free Market)\n- Збір вторсировини\n- Ековікторини з подарунками\n\nПриносьте килимки, їжу та гарний настрій." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Хакатон стартапів" }
              - column: {
                name: description,
                value: "💻 48 годин на створення майбутнього!\n\nРеєструй команду або приєднуйся до інших та створи MVP власного стартапу.\n\n🚀 Умови:\n\n- Наставництво від менторів IT-компаній\n- Пітчинг перед журі\n- Грошові гранти переможцям\n\nХарчування та кава включені." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Лекція з архітектури міста" }
              - column: {
                name: description,
                value: "🏛️ Поринь у міське планування та урбаністику.\n\nЗапрошуємо на лекцію архітектора, який розповість про історію формування міста, етапи його забудови та перспективи розвитку.\n\n📍 Теми:\n\n- Зміна стилів архітектури\n- Проблеми щільності та простору\n- Приклади успішних реконструкцій\n\nВхід за попередньою реєстрацією." }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Флористичний майстер-клас" }
              - column: {
                name: description,
                value: "🌸 Створіть власний квітковий шедевр!\n\nМайстер-клас з флористики допоможе вам навчитись мистецтву створення букетів і композицій з квітів.\n\n🌻 Програма:\n\n- Ознайомлення з квітами та їх властивостями\n- Створення букетів для різних подій\n- Техніки аранжування та догляд за квітами\n\nБукет, створений власноруч, заберете додому!" }

        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Творча майстерня для дітей" }
