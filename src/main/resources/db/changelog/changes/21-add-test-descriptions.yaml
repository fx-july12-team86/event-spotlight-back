      changes:
        - insert:
            tableName: descriptions
            columns:
              - column: { name: title, value: "Майстер-клас з миловаріння" }
              - column: {
                  name: description,
                  value: "🧼 Відкрийте для себе мистецтво створення натурального мила 🌿\n\nЗапрошуємо вас на захоплюючий майстер-клас з миловаріння, де ви зможете зануритися у чарівний світ створення натурального мила власними руками. Це чудова можливість дізнатися більше про мистецтво миловаріння, навчитися основним технікам та створити унікальні мильні шедеври, які стануть прекрасним подарунком або прикрасою для вашого дому.\n🛠️ Всі необхідні матеріали надаються 🛠️\n\nЩо вас очікує:\n\n📚 Теоретична частина: Ознайомлення з основними інгредієнтами та інструментами, які використовуються у миловарінні.\n\n🧪 Практична частина: Покрокове керівництво зі створення мила з натуральних компонентів, включаючи вибір ароматів, барвників та форм.\n\n🎁 Результат: Ви власноруч створите кілька різновидів мила, яке зможете забрати з собою додому." }
        - insert:
            tableName: descriptions
            columns:
              - column: {name: title, value: "Кулінарний майстер-клас"}
              - column: {name: description, value: "🍳 Запрошуємо вас на кулінарний майстер-клас..."}
